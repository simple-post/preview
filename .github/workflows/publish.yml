name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm trusted publishing works for private repositories, but Sigstore
    # provenance currently requires the source repository to be public.
    env:
      NPM_CONFIG_PROVENANCE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: yarn

      # Yarn drives install/build/test; npm publishes because trusted
      # publishing (OIDC + provenance) is an npm CLI feature.
      - name: Install an npm version with trusted publishing support
        run: npm install --global npm@latest

      - run: yarn install --immutable
      - run: yarn version:tag "$GITHUB_REF_NAME"
      - run: yarn check

      - name: Publish framework-agnostic package
        run: npm publish --workspace @simple-post/preview

      - name: Publish React adapter
        run: npm publish --workspace @simple-post/preview-react

      - name: Publish Vue adapter
        run: npm publish --workspace @simple-post/preview-vue
